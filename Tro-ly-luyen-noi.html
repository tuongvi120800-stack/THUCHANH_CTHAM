const $=s=>document.querySelector(s);

const mmss=n=>String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0");

function shuffle(a,seed){const r=a.slice();let s=seed||7;for(let i=r.length-1;i>0;i--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}

/* ============ TIMER ============ */
function stopT(){if(T.id){clearInterval(T.id);T.id=null}T.run=false}
function setT(sec){stopT();T.left=sec;T.total=sec;drawT()}
function startT(){if(T.run||!T.total)return;if(T.left<=0)T.left=T.total;T.run=true;T.id=setInterval(()=>{T.left--;if(T.left<=0){T.left=0;stopT()}drawT()},1000);drawT()}
function drawT(){const c=$("#clk");if(!c)return;c.textContent=mmss(T.left);c.classList.toggle("low",T.left<=10&&T.total>0);const b=$("#tgl");if(b)b.textContent=T.run?"Tạm dừng":(T.left<T.total&&T.left>0?"Tiếp tục":"Bắt đầu")}
function timerHTML(){if(!T.total)return"";return `<div class="timer"><div class="clock" id="clk">${mmss(T.left)}</div><button class="btn sm" data-act="tgl" id="tgl">${T.run?"Tạm dừng":"Bắt đầu"}</button><button class="btn sm ghost" data-act="rst">Đặt lại</button></div>`}

/* HSK5 step */
function initRO(sc){S.ro=sc.ro.map((r,i)=>{let p=shuffle(r.segs.map((s,k)=>k),11+i*5);const join=p.map(k=>r.segs[k]).join("");if(r.ok.includes(join))p=p.reverse();return{pool:p,ans:[],tries:0,done:false,fail:false}})}
function vHSK(sc){
  if(!S.ro)initRO(sc);
  let b=`<p class="lead">Hai dạng bài quen với đề HSK5: sắp xếp câu và viết đoạn. Số lượng và kiểu đề thật có thể khác, đây là bài tập cùng loại kỹ năng.</p><h3>A. Sắp xếp thành câu đúng</h3>`;
  sc.ro.forEach((r,i)=>{const o=S.ro[i];
    b+=`<div class="panel"><div class="seg">${o.pool.map(k=>`<button class="${o.ans.includes(k)?"used":""}" data-act="roadd" data-i="${i}" data-k="${k}">${esc(r.segs[k])}</button>`).join("")}</div><div class="ans">${o.ans.length?o.ans.map(k=>`<button data-act="rodel" data-i="${i}" data-k="${k}">${esc(r.segs[k])}</button>`).join(""):'<span class="vi">Chạm các mảnh theo thứ tự đúng</span>'}</div><div style="display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap"><button class="btn sm" data-act="rochk" data-i="${i}" ${o.ans.length!==r.segs.length||o.done?"disabled":""}>Kiểm tra</button><button class="btn sm ghost" data-act="rorst" data-i="${i}">Làm lại</button><span class="res ${o.done?"ok":o.fail?"no":""}">${o.done?"Đúng rồi":o.fail?"Chưa đúng, thử lại":""}</span></div>${o.done||o.tries>=2?`<div class="hbox" style="margin-top:10px"><div class="zh" style="font-size:calc(18px*var(--z))">${esc(r.ok[0])}</div><div class="vi">${esc(r.vi)}</div></div>`:""}</div>`});
  const w=sc.wr,n=han(S.wr);
  b+=`<h3>B. Viết đoạn (80 chữ Hán trở lên)</h3><div class="panel"><p style="margin:0 0 8px">${esc(w.tip)}</p><div class="chips" id="wchips">${w.words.map(x=>`<span class="chip ${S.wr.includes(x)?"j":""}" data-w="${esc(x)}">${esc(x)}</span>`).join("")}</div><textarea id="wr" rows="6" placeholder="Viết tiếng Trung ở đây">${esc(S.wr)}</textarea><div class="meter" id="wm">${wmeter(sc)}</div><div style="margin-top:10px"><button class="btn sm ghost" data-act="wmodel">${S.wrModel?"Ẩn bài mẫu":"Xem bài mẫu"}</button></div>${S.wrModel?`<div class="hbox" style="margin-top:10px"><div class="zh" style="font-size:calc(17px*var(--z))">${esc(w.model)}</div><div class="vi" style="margin-top:6px">${esc(w.vi)}</div><div class="note">Bài mẫu dài ${han(w.model)} chữ Hán.</div></div>`:""}</div>`;
  return b;
}
function wmeter(sc){const n=han(S.wr),miss=sc.wr.words.filter(x=>!S.wr.includes(x));return `Số chữ Hán: <b>${n}</b> / 80 ${n>=80?"· đủ":""} · Từ đã dùng: ${sc.wr.words.length-miss.length} / ${sc.wr.words.length}${miss.length?" · còn thiếu: "+miss.join("、"):""}`}
function bindWriting(){const t=$("#wr");if(!t)return;t.addEventListener("input",()=>{S.wr=t.value;const sc=cur();$("#wm").innerHTML=wmeter(sc);document.querySelectorAll("#wchips .chip").forEach(c=>c.classList.toggle("j",S.wr.includes(c.dataset.w)))})}

/* summary */
function hintTotal(){return S.hint[0]+S.hint[1]+S.hint[2]}
function vSum(sc){
  const errs=Object.entries(S.errs).filter(e=>e[1]>0);
  return `<h3>Tự chấm</h3><div class="panel">${sc.checks.map((c,i)=>`<label class="chk"><input type="checkbox" data-act="chk" data-i="${i}" ${S.checks[i]?"checked":""}><span>${esc(c)}</span></label>`).join("")}</div>
  <h3>Cụm đã dùng được hôm nay</h3><div class="panel">${sc.phrases.map((p,i)=>`<label class="chk"><input type="checkbox" data-act="used" data-i="${i}" ${S.used[i]?"checked":""}><span><span class="zh" style="font-size:calc(17px*var(--z))">${esc(p[0])}</span> <span class="vi">${esc(p[1])}</span></span></label>`).join("")}</div>
  <h3>Số liệu buổi này</h3><div class="panel meter">Gợi ý đã mở: bậc 1 × ${S.hint[0]}, bậc 2 × ${S.hint[1]}, bậc 3 × ${S.hint[2]}.<br>Lỗi cô ghi: ${errs.length?errs.map(e=>esc(e[0])+" × "+e[1]).join("; "):"chưa có"}.<br>Khung đã nói: lượt 1 ${S.fd[0]} ý, lượt 2 ${S.fd[1]} ý.<br>Bài viết: ${han(S.wr)} chữ Hán.</div>
  <div class="nav"><button class="btn" data-act="save" ${S.saved?"disabled":""}>${S.saved?"Đã lưu vào Lịch sử":"Lưu buổi này"}</button><button class="btn ghost" data-act="home">Tình huống khác</button></div>`;
}
function vHist(){
  if(!H.hist.length)return `<div class="panel"><p class="lead" style="margin:0">Chưa có buổi nào được lưu. Hoàn thành một tình huống rồi bấm "Lưu buổi này" ở chặng tổng kết.</p></div>`;
  const rows=H.hist.slice().reverse().map(h=>{const s=SC.find(x=>x.id===h.sc)||{title:h.sc,phrases:[]};const e=Object.entries(h.errs||{}).filter(x=>x[1]>0).map(x=>x[0]+" ×"+x[1]).join("; ")||"—";const un=(s.phrases||[]).filter((p,i)=>!(h.used||[])[i]).map(p=>p[0]).join("、")||"—";
    return `<tr><td>${new Date(h.t).toLocaleDateString("vi-VN")}</td><td>${esc(s.title)}</td><td>${h.hint.join(" / ")}</td><td>${esc(e)}</td><td class="zh">${esc(un)}</td></tr>`}).join("");
  return `<div class="panel scroll"><table><thead><tr><th>Ngày</th><th>Tình huống</th><th>Gợi ý 1/2/3</th><th>Lỗi cô ghi</th><th>Cụm chưa dùng được</th></tr></thead><tbody>${rows}</tbody></table></div><p class="note">Cột cuối là danh sách ôn lại cho buổi sau. Dữ liệu lưu trên trình duyệt này.</p><button class="btn sm ghost" data-act="clr">${S.clearAsk?"Bấm lần nữa để xoá hết":"Xoá lịch sử"}</button>`;
}

/* ============ TEACHER DRAWER ============ */
function renderGV(){
  const g=$("#gv");g.hidden=!S.gv;document.body.classList.toggle("gvopen",S.gv);
  if(!S.gv)return;
  const sc=S.view==="run"?cur():null;
  const q=sc&&S.order.length?sc.qs[S.order[S.qi%S.order.length]]:null;
  g.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h4>Bảng giáo viên</h4><button class="btn sm ghost" data-act="gvclose">Đóng và khoá</button></div><div class="note">${sc?esc(sc.title)+" · chặng "+(S.step+1)+"/8":"Chọn một tình huống để bắt đầu."}</div>
  <h5>Ghi lỗi một chạm</h5><div class="tagrid">${TAGS.map(t=>`<button class="tagb" data-act="err" data-t="${esc(t)}">${esc(t)}<b>${S.errs[t]||0}</b></button>`).join("")}<button class="tagb" data-act="errundo">Hoàn tác</button></div>
  <h5>Bản sửa cho học viên (ưu tiên 3–4 chỗ)</h5>${S.corr.map((c,i)=>`<div class="row2"><input class="mini" data-f="w" data-i="${i}" placeholder="Học viên nói" value="${esc(c.w)}"><input class="mini" data-f="r" data-i="${i}" placeholder="Nói đúng là" value="${esc(c.r)}"></div>`).join("")}${S.corr.length<8?`<button class="btn sm ghost" data-act="corradd">+ Thêm chỗ sửa</button>`:`<div class="note">Đã tới 8 chỗ, nhiều hơn thế học viên khó nhớ.</div>`}
  <h5>Nhắc trên màn học viên</h5><div class="tagrid">${CUES.map(c=>`<button class="cue" data-act="cue" data-t="${esc(c)}">${esc(c)}</button>`).join("")}</div>
  ${q?`<h5>Câu hỏi ngược hiện tại</h5><div class="gvq"><div class="zh" style="font-size:calc(16px*var(--z))">${esc(q.z)}</div><div class="note">Gợi ý trả lời:</div><div class="zh">${esc(q.a)}</div><div class="vi">${esc(q.av)}</div>${q.n?`<div class="note">Lưu ý: ${esc(q.n)}</div>`:""}<div style="margin-top:8px"><button class="btn sm ghost" data-act="qnext">Câu khác</button></div></div>`:""}
  <h5>Ghi chú</h5><textarea class="mini" id="gnote" rows="3" style="font-family:var(--f-body)" placeholder="Điều cần nhớ cho buổi sau">${esc(S.note)}</textarea>
  <h5>Đề xuất thêm câu hỏi (AI, em duyệt trước)</h5><textarea class="mini" id="gai" rows="2" style="font-family:var(--f-body)" placeholder="Tóm tắt ý học viên vừa nói">${esc(S.ai.in)}</textarea><div style="margin-top:6px"><button class="btn sm" data-act="ai" ${S.ai.busy||!sc?"disabled":""}>${S.ai.busy?"Đang hỏi…":"Đề xuất câu hỏi ngược"}</button></div>${S.ai.msg?`<div class="note" style="margin-top:6px">${esc(S.ai.msg)}</div>`:""}${S.ai.res?`<div class="gvq" style="margin-top:8px"><div class="zh" style="font-size:calc(16px*var(--z))">${esc(S.ai.res.zh)}</div><div class="vi">${esc(S.ai.res.vi)}</div><div class="note">Gợi ý trả lời: ${esc(S.ai.res.goiy||"")}</div><div class="note">Tiếng Trung do AI viết, hãy đọc kỹ rồi mới dùng.</div><div style="margin-top:8px"><button class="btn sm" data-act="aiuse">Đưa lên màn học viên</button></div></div>`:""}
  <h5>Mã PIN</h5><button class="btn sm ghost" data-act="pinchg">Đổi PIN</button>
  <h5>Tóm tắt để chép</h5><button class="btn sm ghost" data-act="copy">Sao chép tóm tắt buổi</button><div class="note" id="cpmsg"></div>`;
  g.querySelectorAll("input[data-f]").forEach(el=>el.addEventListener("input",()=>{S.corr[+el.dataset.i][el.dataset.f]=el.value}));
  const n=$("#gnote");if(n)n.addEventListener("input",()=>{S.note=n.value});
  const a=$("#gai");if(a)a.addEventListener("input",()=>{S.ai.in=a.value});
}
function summaryText(){
  const sc=S.sc?cur():null;if(!sc)return"";
  const errs=Object.entries(S.errs).filter(e=>e[1]>0).map(e=>e[0]+" × "+e[1]).join("; ")||"không ghi";
  const fixes=S.corr.filter(c=>c.r).map(c=>(c.w?c.w+" → ":"")+c.r).join(" | ")||"không có";
  const used=sc.phrases.filter((p,i)=>S.used[i]).map(p=>p[0]).join("、")||"chưa tick";
  const un=sc.phrases.filter((p,i)=>!S.used[i]).map(p=>p[0]).join("、")||"không còn";
  return `Tình huống: ${sc.title}\nGợi ý đã mở (bậc 1/2/3): ${S.hint.join("/")}\nLỗi: ${errs}\nSửa: ${fixes}\nCụm dùng được: ${used}\nCụm ôn lại buổi sau: ${un}\nKhung đã nói (lượt 1 / lượt 2): ${S.fd[0]} / ${S.fd[1]} ý\nBài viết: ${han(S.wr)} chữ Hán\nGhi chú: ${S.note||"—"}`;
}

/* ============ ACTIONS ============ */
function enter(id){
  stopT();
  const sc=SC.find(x=>x.id===id);
  S=Object.assign(S,{view:"run",sc:id,step:0,hint:[0,0,0],shown:{},order:shuffle(sc.qs.map((q,i)=>i),Date.now()%997+3),qi:0,qvi:false,corr:newCorr(),errs:{},note:"",checks:[0,0,0],used:[0,0,0,0,0],ro:null,wr:"",wrModel:false,banner:"",aiQ:null,hskOpen:null,saved:false,fill:[],fdone:[],fd:[0,0],ai:{busy:false,msg:"",in:"",res:null}});
  setT(0);render();
}
function goStep(n){
  stopT();if(S.step===2)S.fd[0]=S.fdone.filter(Boolean).length;if(S.step===5)S.fd[1]=S.fdone.filter(Boolean).length;S.step=n;S.shown={};S.qvi=false;S.fdone=[];
  const d=STEPS[n][1];setT(d);render();window.scrollTo(0,0);
}
async function askAI(){
  const sc=cur();if(!sc)return;
  S.ai.busy=true;S.ai.msg="";S.ai.res=null;renderGV();
  try{
    const s=window.claude&&window.claude.use?await window.claude.use("sample"):null;
    if(!s){S.ai.msg="Tính năng AI không có trong cửa sổ này.";S.ai.busy=false;renderGV();return}
    const p="Bạn hỗ trợ một giáo viên tiếng Trung. Tình huống luyện nói: "+sc.title+". Bối cảnh: "+sc.ctx+" Học viên trình độ HSK3-4, đang ôn HSK5. Ý học viên vừa nói: \""+(S.ai.in||"(chưa tóm tắt)")+"\". Hãy đề xuất MỘT câu hỏi ngược mà người đối diện sẽ hỏi tiếp, bằng tiếng Trung giản thể, tối đa 30 chữ Hán, từ vựng không vượt HSK5, không bịa số liệu. Chỉ trả về JSON một dòng dạng {\"zh\":\"câu hỏi\",\"vi\":\"nghĩa tiếng Việt\",\"goiy\":\"một câu gợi ý bằng tiếng Việt để học viên trả lời\"}.";
    let v;
    if(typeof s.json==="function"){v=await s.json(p)}
    else{const r=await s(p);const m=String(r.text||"").match(/\{[\s\S]*\}/);v=m?JSON.parse(m[0]):null}
    if(v&&v.zh&&v.vi){S.ai.res={zh:String(v.zh),vi:String(v.vi),goiy:String(v.goiy||"")}}else S.ai.msg="AI không trả về câu hỏi dùng được. Thử lại hoặc dùng câu có sẵn.";
  }catch(e){S.ai.msg=(e&&e.code==="rate_limited")?"Đang bị giới hạn lượt hỏi, đợi một lát.":(e&&e.code==="not_granted")?"Chưa được cấp quyền dùng AI.":"Không hỏi được AI lúc này."}
  S.ai.busy=false;renderGV();
}
function copyText(t){
  const done=ok=>{const m=$("#cpmsg");if(m)m.textContent=ok?"Đã sao chép.":"Không sao chép tự động được, hãy chọn và chép thủ công."};
  const fb=()=>{const ta=document.createElement("textarea");ta.value=t;ta.style.cssText="position:fixed;opacity:0";document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}ta.remove();done(ok)};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>done(true),fb)}else fb();
}

const ZKEY="tro-ly-luyen-noi-z";
function setZ(z){z=Math.max(.9,Math.min(1.7,Math.round(z*10)/10));document.documentElement.style.setProperty("--z",z);try{localStorage.setItem(ZKEY,String(z))}catch(e){}}
try{const z0=parseFloat(localStorage.getItem(ZKEY));if(z0>=.9&&z0<=1.7)document.documentElement.style.setProperty("--z",z0)}catch(e){}
const curZ=()=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--z"))||1.2;
let tap=0,tapT=0,pinMode="enter",PIN_MEM=null;
const PINKEY="tro-ly-luyen-noi-pin-v1";
function getPin(){try{const v=localStorage.getItem(PINKEY);if(v)return v}catch(e){}return PIN_MEM}
function setPin(v){PIN_MEM=v;try{localStorage.setItem(PINKEY,v)}catch(e){}}
function pinAsk(mode){
  const has=getPin();pinMode=mode||(has?"enter":"set");
  $("#pin-t").textContent=pinMode==="enter"?"Nhập mã PIN":(has?"Đổi mã PIN":"Đặt mã PIN lần đầu");
  $("#pin-d").textContent=pinMode==="enter"?"Chỉ giáo viên mở được bảng này.":"Chọn 4 chữ số. Hãy đặt khi học viên chưa ở đó, và nhớ mã này.";
  $("#pin-ok").textContent=pinMode==="enter"?"Mở":"Lưu";$("#pin-m").textContent="";
  const i=$("#pin-i");i.value="";$("#pin").hidden=false;setTimeout(()=>i.focus(),30);
}
function pinClose(){$("#pin").hidden=true;$("#pin-i").value=""}
$("#pinf").addEventListener("submit",e=>{
  e.preventDefault();const v=$("#pin-i").value.trim(),m=$("#pin-m");
  if(!/^\d{4}$/.test(v)){m.textContent="PIN gồm đúng 4 chữ số.";return}
  if(pinMode==="enter"){if(v===getPin()){pinClose();S.gv=true;renderGV()}else{m.textContent="Sai PIN.";$("#pin-i").value="";}}
  else{setPin(v);pinClose();S.gv=true;renderGV()}
});
$("#pin-x").addEventListener("click",pinClose);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#pin").hidden)pinClose()});
document.addEventListener("click",ev=>{
  const el=ev.target.closest("[data-act]");
  const br=ev.target.closest(".brand");
  if(br){const n=Date.now();tap=(n-tapT<1200)?tap+1:1;tapT=n;if(tap>=3){tap=0;if(S.gv){S.gv=false;renderGV()}else pinAsk()}return}
  if(!el)return;
  const a=el.dataset.act,d=el.dataset;
  switch(a){
    case"zm":setZ(curZ()-.1);break;
    case"zp":setZ(curZ()+.1);break;
    case"gvclose":S.gv=false;renderGV();break;
    case"pinchg":pinAsk("set");break;
    case"home":stopT();S.view="home";S.clearAsk=false;render();break;
    case"hist":stopT();S.view="hist";S.clearAsk=false;render();break;
    case"start":enter(d.id);break;
    case"next":goStep(Math.min(7,S.step+1));break;
    case"prev":goStep(Math.max(0,S.step-1));break;
    case"tgl":T.run?stopT():startT();drawT();break;
    case"rst":setT(STEPS[S.step][1]);break;
    case"hint":{const n=+d.n;if(!S.shown[n]){S.shown[n]=1;S.hint[n-1]++}else S.shown[n]=0;render();break}
    case"hsk":S.hskOpen=S.hskOpen===+d.i?null:+d.i;render();break;
    case"qvi":S.qvi=!S.qvi;render();break;
    case"qnext":S.qi++;S.qvi=false;render();break;
    case"nobanner":S.banner="";render();break;
    case"roadd":{const o=S.ro[+d.i];const k=+d.k;if(!o.ans.includes(k)&&!o.done){o.ans.push(k);o.fail=false}render();break}
    case"rodel":{const o=S.ro[+d.i];if(!o.done){o.ans=o.ans.filter(x=>x!==+d.k);o.fail=false}render();break}
    case"rorst":{const o=S.ro[+d.i];o.ans=[];o.fail=false;o.done=false;render();break}
    case"rochk":{const r=cur().ro[+d.i],o=S.ro[+d.i];const j=o.ans.map(k=>r.segs[k]).join("");if(r.ok.includes(j)){o.done=true;o.fail=false}else{o.fail=true;o.tries++}render();break}
    case"wmodel":S.wrModel=!S.wrModel;render();break;
    case"fdone":S.fdone[+d.i]=el.checked?1:0;break;
    case"chk":S.checks[+d.i]=el.checked?1:0;break;
    case"used":S.used[+d.i]=el.checked?1:0;break;
    case"save":{S.saved=true;H.hist.push({t:new Date().toISOString(),sc:S.sc,hint:S.hint.slice(),errs:Object.assign({},S.errs),used:S.used.slice(),checks:S.checks.slice(),words:han(S.wr),note:S.note});saveH();render();break}
    case"clr":if(S.clearAsk){H.hist=[];saveH();S.clearAsk=false}else S.clearAsk=true;render();break;
    case"err":S.errs[d.t]=(S.errs[d.t]||0)+1;S.lastErr=d.t;renderGV();break;
    case"corradd":if(S.corr.length<8)S.corr.push({w:"",r:""});renderGV();break;
    case"errundo":if(S.lastErr&&S.errs[S.lastErr]>0){S.errs[S.lastErr]--}renderGV();break;
    case"cue":S.banner=d.t;render();break;
    case"ai":askAI();break;
    case"aiuse":if(S.ai.res){S.aiQ=S.ai.res;if(S.view==="run"&&S.step!==3)goStep(3);else render()}break;
    case"copy":copyText(summaryText());break;
  }
});
document.addEventListener("input",ev=>{const el=ev.target;if(el.classList&&el.classList.contains("blank")){const i=+el.dataset.i;S.fill[i]=S.fill[i]||[];S.fill[i][+el.dataset.b]=el.value}});
document.addEventListener("change",ev=>{const el=ev.target;if(el.dataset&&el.dataset.act==="chk")S.checks[+el.dataset.i]=el.checked?1:0;if(el.dataset&&el.dataset.act==="used")S.used[+el.dataset.i]=el.checked?1:0});
render();
})();
</script>
</body></html>
